# Render blueprint — deploys the full DJ Song Request Platform (backend API + frontend).
# Create both services at once: https://render.com -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: dj-platform-api
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm install
    startCommand: npm --prefix backend run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://www.djlink.space
      - key: BACKEND_URL
        value: https://dj-platform-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://dj-platform.onrender.com,https://dj-platform-api.onrender.com,https://djlink.space,https://www.djlink.space
      - key: PUBLIC_APP_URL
        value: https://www.djlink.space
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/dj-platform.db
      - key: MTN_MOMO_NUMBER
        value: '0788205500'
      - key: MTN_MOMO_USSD
        value: '*182*8*1*1540166*22000#'
      - key: MOMO_ACCOUNT_NAME
        value: Ken
      - key: SUBSCRIPTION_FEE
        value: '22000'
      - key: SUBSCRIPTION_FEE_USD
        value: '15'
      - key: USD_RWF_RATE
        value: '1469'

  - type: web
    name: dj-platform
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm install --include=dev && npm --prefix frontend run build
    startCommand: npm --prefix frontend run start -- -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://www.djlink.space
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.djlink.space
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          name: dj-platform-api
          type: web
          envVarKey: BACKEND_URL